<style>
:root {
  --bg: #fbf6ec; --card: #ffffff; --ink: #2b2a26; --muted: #7a7466; --line: #eadfca;
  --green: #2f7d4f; --green-ink: #ffffff; --orange: #e8892b; --orange-soft: #fdeed8; --red: #c0392b; --ok: #2f7d4f;

}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: 'Heebo', system-ui, -apple-system, 'Segoe UI', sans-serif; line-height: 1.45; padding-bottom: 96px; }

.pill { border-radius: 99px; padding: 11px 22px; font-weight: 700; cursor: pointer; white-space: nowrap; border: 1.5px solid var(--ink); background: transparent; }

#cartbar { position: fixed; inset: auto 0 0 0; z-index: 40; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, var(--bg) 35%); pointer-events: none; }

/* עגלה קבועה בפינה + אנימציית הוספה */
#fcart { position: fixed; left: 10px; top: 106px; z-index: 41; width: 48px; height: 48px; border-radius: 50%; border: 0; padding: 0; background: var(--green); color: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 10px rgba(0,0,0,.3); cursor: pointer; }

.tbl.cpt th, .tbl.cpt td { padding: 8px 4px; font-size: .82rem; }
.tbl .nw { white-space: nowrap; direction: ltr; text-align: right; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: up .25s ease; } @keyframes up { from { transform: translateY(40px); opacity: .4; } } }



#sidetab { position: fixed; left: 0; top: 38%; z-index: 40; display: flex; direction: ltr; transform: translateX(-100%) translateX(17px); transition: transform .25s ease; }
#sidetab.open { transform: none; }
@media (hover: hover) { #sidetab:hover { transform: none; } }
#sidetab .sp { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px 12px 16px 8px; background: rgba(253,244,228,.92); border: 1.5px solid #24613f; border-left-width: 0; border-radius: 0 36px 36px 0; box-shadow: none; }
#sidetab .sp a { display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 50%; background: #2a211c; border: 2.5px solid #f0e2c4; color: #fff; box-shadow: 0 4px 12px rgba(0,0,0,.3); }
#sidetab .sp a svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.mapbox { position: relative; margin-top: 10px; border-radius: 16px; overflow: hidden; height: 300px; background: #e8e4da; border: 2px solid var(--gold); }
.mapbox iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
#sidetab .sh { align-self: center; position: relative; width: 17px; height: 128px; border: 0; padding: 0; cursor: pointer; background: #24613f; color: #fff; font-size: 1.1rem; font-weight: 800; border-radius: 0 14px 14px 0; box-shadow: 4px 2px 10px rgba(0,0,0,.2); }
#sidetab .sh::after { content: ''; position: absolute; top: 0; bottom: 0; left: 0; right: -14px; }
#sidetab .sh span { display: inline-block; animation: nudge 3s ease-in-out infinite; }
#sidetab.open .sh span { animation: none; }
@keyframes nudge { 0%, 45%, 100% { transform: translateX(0); } 12% { transform: translateX(5px); } 24% { transform: translateX(-3px); } 36% { transform: translateX(4px); } }
@media (prefers-reduced-motion: reduce) { #sidetab .sh span { animation: none; } }
header.hero { position: relative; }
header.hero .bsd { position: absolute; top: 10px; right: 16px; font-size: .75rem; opacity: .85; letter-spacing: .3px; }
.hc { margin-top: 16px; }
.hc .addr { margin: 0 0 10px; font-size: .95rem; opacity: .92; }
.hc .acts { display: flex; flex-wrap: wrap; gap: 8px; }
.hc .acts a { display: inline-flex; align-items: center; gap: 7px; padding: 10px 16px; border-radius: 99px; font-weight: 800; text-decoration: none; background: #fff; color: #1f5c39; font-size: .95rem; }
.hc .acts a.ic { padding: 5px; border-radius: 14px; }
.hc .acts a.call { padding: 0 4px; background: transparent; border-radius: 10px; }
.hc .acts a.waze { background: #33ccff; }
.hc .acts a.wa { background: #25d366; }
.hc details { margin-top: 10px; }
.hc summary { cursor: pointer; list-style: none; display: inline-block; padding: 0 4px; }
.hc summary::-webkit-details-marker { display: none; }
.hc .map { position: relative; margin-top: 10px; border-radius: 16px; overflow: hidden; height: 280px; background: #e8e4da; }
.hc .map iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

/* ===== סגנון תפריט: קרם, ירוק כהה, זהב ===== */
:root { --bg: #fbead4; --card: #fff6e6; --ink: #2a2a20; --muted: #6b6451; --line: #d6b678; --green: #23401f; --green-ink: #fff3dc; --gold: #b3862f; --orange: #b3862f; --orange-soft: #f6e2bd; color-scheme: light; }
body { background: radial-gradient(ellipse at 50% 0, #fdf0dd, #fbead4 60%) fixed; position: relative; overflow-x: hidden; font-family: 'Heebo', sans-serif; }
:root { --lf: min(23vw, 130px); }
.lf { position: absolute; z-index: 5; pointer-events: none; height: auto; max-width: none; }
.lf.tl { top: calc(var(--lf) * .015); left: calc(var(--lf) * .02); width: var(--lf); }
.lf.tr { top: calc(var(--lf) * .01); right: 0; width: calc(var(--lf) * .872); }
.lf.bl { bottom: calc(var(--lf) * .05); left: calc(var(--lf) * .046); width: calc(var(--lf) * .592); }
.lf.br { bottom: calc(var(--lf) * .05); right: calc(var(--lf) * .097); width: calc(var(--lf) * .643); }
header.hero { background: transparent; color: var(--ink); text-align: center; padding: 22px 0 18px; border-radius: 0; }
header.hero .wrap { display: flex; flex-direction: column; align-items: center; }
header.hero .hlogo { width: min(56vw, 250px); height: auto; margin: 6px auto 6px; border: 0; border-radius: 0; padding: 0; background: none; box-shadow: none; }
header.hero .bsd { color: var(--ink); opacity: .75; z-index: 6; right: auto; left: 50%; transform: translateX(-50%); top: 8px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.hand { font-family: 'Gveret Levin', 'Heebo', cursive; font-size: 1.7rem; margin: 0 0 4px; color: var(--ink); opacity: 1; }
.hand span { color: #2a2a20; font-size: 1.3rem; }
.badges { justify-content: center; }
.badge { background: transparent; border: 1.5px solid var(--gold); color: var(--green); font-weight: 700; }
.hc { width: 100%; }
.hc .map { border: 2px solid var(--gold); width: 100%; }
nav.cats { background: #fbead4; margin-top: 0; }
.chip { background: transparent; border-color: var(--gold); color: var(--green); }
.chip[aria-current="true"] { background: var(--green); border-color: var(--green); color: var(--green-ink); }
section.cat { text-align: center; padding-top: 22px; }
section.cat h2 { display: table; margin: 0 auto -18px; position: relative; z-index: 2; color: var(--green-ink); font-family: 'Heebo', sans-serif; font-weight: 800; font-size: 1.45rem; padding: 4px 38px; }
section.cat h2::before { content: ''; position: absolute; inset: 0; background: var(--green); z-index: -1; filter: url(#rough); border-radius: 8px; }
.cardlist { text-align: right; background: rgba(255,248,234,.75); border: 1.5px solid var(--gold); box-shadow: none; padding: 26px 16px 4px; border-radius: 22px; }
.item { border-bottom: 1px dashed var(--line); }
.item h3 { font-family: 'Heebo', sans-serif; }
.item .pic { border: 1.5px solid var(--line); }
.item .price { font-family: 'Heebo', sans-serif; font-weight: 800; color: var(--green); }
.opt { border-color: var(--green); color: var(--green); }
.opt[aria-pressed="true"] { background: var(--green); color: var(--green-ink); }
.pill.dark { background: var(--green); border-color: var(--green); color: var(--green-ink); }
#cartbar button { background: var(--green); color: var(--green-ink); border: 2px solid var(--gold); }
.sheet { background: #fbead4; }
.sheet h2 { font-family: 'Heebo', sans-serif; font-weight: 800; color: var(--green); }
.btn.alt { background: var(--gold); color: #fff; }
.admin h1 { font-family: 'Heebo', sans-serif; font-weight: 800; color: var(--green); }
#sidetab .sh { background: var(--green); }
#sidetab .sp { border-color: var(--green); }
footer { color: var(--ink); padding-bottom: 70px; }

.newbar { margin: 4px auto 8px; background: var(--gold); color: #fff; font-weight: 800; padding: 7px 16px; border-radius: 99px; font-size: .95rem; box-shadow: 0 3px 10px rgba(0,0,0,.18); }
.newbar a { color: #fff; text-decoration: underline; }
.facts { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 12px 0; }
.facts span { background: rgba(255,248,234,.85); border: 1.5px solid var(--gold); border-radius: 99px; padding: 5px 14px; font-weight: 700; font-size: .88rem; color: var(--green); }
.dirs { text-align: right; margin-top: 10px; padding: 12px 14px; background: rgba(255,248,234,.85); border: 1.5px solid var(--gold); border-radius: 16px; font-size: .92rem; line-height: 1.6; }
.dirs b { color: var(--green); display: block; }
.dirs a { color: var(--green); font-weight: 800; }
.catnote { margin: 0 0 4px; font-size: .88rem; color: var(--muted); text-align: center; }
.rwrap { filter: drop-shadow(0 4px 8px rgba(60,40,10,.28)); margin: 14px 4px 16px; }
.receipt { background: #fffdf6; color: #2a2a20; padding: 30px 18px 32px; font-size: .95rem; -webkit-mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / 18px 51% repeat-x, conic-gradient(from 135deg at top, #0000, #000 1deg 89deg, #0000 90deg) top / 18px 51% repeat-x; mask: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) bottom / 18px 51% repeat-x, conic-gradient(from 135deg at top, #0000, #000 1deg 89deg, #0000 90deg) top / 18px 51% repeat-x; }
.receipt .rlogo { display: block; width: 130px; height: auto; border-radius: 0; margin: 0 auto 4px; }
.receipt .rbsd { text-align: center; font-size: .72rem; opacity: .7; }
.receipt .rtitle { text-align: center; font-weight: 800; font-size: 1.05rem; margin-top: 4px; }
.receipt .rmeta { text-align: center; font-size: .82rem; color: var(--muted); }
.receipt .rsep { border-top: 2px dashed #cdbd9c; margin: 10px 0; }
.receipt .rrow, .receipt .ritem, .receipt .rtotal { display: flex; justify-content: space-between; gap: 10px; padding: 2px 0; }
.receipt .ritem small { color: var(--muted); }
.receipt .ritem b, .receipt .rrow b { font-variant-numeric: tabular-nums; }
.receipt .rdisc { color: var(--ok); }
.receipt .rtotal { font-size: 1.25rem; font-weight: 800; border-top: 2px solid #2a2a20; margin-top: 6px; padding-top: 8px; }
.receipt .rnote { margin-top: 8px; font-size: .85rem; background: #f6ecd6; border-radius: 8px; padding: 6px 8px; }
.receipt .rfoot { text-align: center; font-size: .85rem; line-height: 1.6; }

/* הגדלת תמונת מוצר בלחיצה */
.item .pic img { cursor: zoom-in; }
#lb { position: fixed; inset: 0; z-index: 80; background: rgba(0,0,0,.78); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; cursor: zoom-out; }
#lb img { width: min(92vw, 336px); max-height: 78vh; height: auto; object-fit: contain; border-radius: 18px; background: var(--card); box-shadow: 0 10px 40px rgba(0,0,0,.5); }
#lb .cap { color: #fff; font-weight: 800; font-size: 1.1rem; text-align: center; }
#lb button { position: absolute; top: calc(12px + env(safe-area-inset-top)); left: 12px; width: 40px; height: 40px; border: 0; border-radius: 50%; background: rgba(255,255,255,.92); color: #222; font-size: 1.2rem; cursor: pointer; }
@media (prefers-reduced-motion: no-preference) { #lb img { animation: lbzoom .18s ease; } @keyframes lbzoom { from { transform: scale(.7); opacity: 0; } } }
/* בחירת איסוף / משלוח */
.dsel { display: flex; gap: 8px; margin: 10px 0; }
.dsel button { flex: 1; padding: 12px 8px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card); color: var(--ink); font-weight: 800; font-family: inherit; cursor: pointer; }
.dsel button[aria-pressed="true"] { background: var(--green); color: var(--green-ink); border-color: var(--green); }
.zsel { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: -2px 0 10px; }
.zsel[hidden] { display: none; }
.zopt { display: flex; flex-direction: column; gap: 6px; align-items: stretch; text-align: center; background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 8px; font-weight: 800; }
.zopt a { color: var(--green); text-decoration: underline; text-underline-offset: 3px; }
.zopt button { padding: 9px 6px; border-radius: 10px; border: 1.5px solid var(--green); background: transparent; color: var(--green); font-weight: 800; font-family: inherit; cursor: pointer; }
.zopt button[aria-checked="true"] { background: var(--green); color: var(--green-ink); }
.zopt small { font-weight: 500; font-size: .78rem; color: var(--muted); }
.zhint { grid-column: 1 / -1; font-size: .8rem; color: var(--muted); font-weight: 500; }
.dsel small { display: block; font-weight: 500; opacity: .85; }
/* כרטיסי מנות – כל מנה בכרטיס נפרד, תמונה צמודה לצד ימין */
.cardlist { background: transparent; border: 0; box-shadow: none; padding: 26px 0 4px; display: flex; flex-direction: column; gap: 12px; }
.catnote { margin-bottom: 0; }
.item, .item:last-child { padding: 0; gap: 0; align-items: stretch; min-height: 150px; background: var(--card); border: 1px solid color-mix(in srgb, var(--gold) 75%, transparent); border-radius: 12px; overflow: hidden; }
.item .pic { position: relative; width: 36%; max-width: 160px; height: auto; align-self: stretch; border: 0; border-radius: 0; }
.item .pic img { position: absolute; inset: 0; }
.item .info { padding: 14px 16px 12px; text-align: right; }
.item h3 { font-size: 1.1rem; }
.item .desc { font-size: .9rem; color: var(--muted); }
.item .per { font-size: .85rem; color: var(--muted); margin-top: 6px; }
.item .bottom { align-items: flex-end; }
.item .price { font-size: 1.15rem; font-weight: 800; color: var(--ink); }
.item .price small { font-size: .95rem; }
.ordernote { display: table; max-width: calc(100% - 8px); box-sizing: border-box; margin: 12px auto 0; text-align: center; background: var(--green); border: 2px solid var(--gold); border-radius: 10px; padding: 0 14px 1px; font-family: 'Amatic SC', 'Gveret Levin', 'Heebo', cursive; font-weight: 700; font-size: 1.2rem; line-height: 1.1; letter-spacing: .3px; color: #ffd54a; }
.item .price .ppu { font-size: .8rem; font-weight: 300; color: var(--muted); white-space: nowrap; }
.item .psub { font-size: .8rem; color: var(--muted); font-weight: 500; margin-top: 1px; }
.item .plus { flex: none; width: 38px; height: 38px; border: 0; border-radius: 50%; background: #ecdcb8; color: #4a3519; font-size: 1.6rem; line-height: 1; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; padding: 0 0 2px; }
/* שלוש שורות הסלוגן – כתב יד כמו בתפריט */
.tag { text-align: center; margin: 4px auto 8px; color: #2a2420; font-family: 'Gveret Levin', 'Secular One', cursive; line-height: 1.15; }
.tag .t1 { font-size: 2.4rem; transform: rotate(-3deg); }
.tag .t2 { font-size: 1.65rem; margin-top: 6px; transform: rotate(-2deg); }
.tag .t3 { font-size: 1.5rem; margin-top: 2px; transform: rotate(-2deg); }
.tag .tsw { display: block; width: 210px; max-width: 70vw; height: auto; margin: -4px auto 0; fill: #2a2420; }
/* מתכונים: שם גדול · כותרת "מרכיבים / אופן ההכנה" בינונית · תוכן קטן */
.rc { background: var(--card); border: 1px solid color-mix(in srgb, var(--gold) 75%, transparent); border-radius: 12px; padding: 14px 16px; margin: 0 0 12px; }
.rc summary { list-style: none; cursor: pointer; }
.rc summary::-webkit-details-marker { display: none; }
/* כל כרטיסי המנות באותו גובה (גובה כרטיס "חומוס ביתי"; נמדד ב-fitItems). כרטיס עם בחירת גודל פתוחה רשאי לגדול */
.item { height: var(--ih, auto); }
.item.open { height: auto; min-height: var(--ih, 150px); }
.item .desc { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.item.open .desc { -webkit-line-clamp: unset; display: block; }
/* ---- תפריט נגישות ---- */
#a11y-root { font-family: 'Heebo', sans-serif; direction: rtl; }

      var rcb = e.target.closest('[data-rcat]'); if (rcb) { rcActive = rcb.dataset.rcat; rcLock = Date.now() + 900; rcMark(); var sx = $('#rcat-' + rcActive); if (sx) sx.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
      var pnb = e.target.closest('[data-pcat]'); if (pnb) { pnActive = pnb.dataset.pcat; pnLock = Date.now() + 900; pnMark(); var px = $('#pcat-' + pnActive); if (px) px.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
      if (e.target.id === 'pnwa') { var tx = pnShopText(); if (!tx) { alert('אין מה להזמין: כל המלאי מגיע למינימום'); return; } window.open('https://wa.me/?text=' + encodeURIComponent(tx), '_blank'); return; }
      var pa = e.target.closest('[data-padd]'); if (pa) { pnForm = pa.dataset.padd; pnImg = ''; paint(); var pf = $('#pnname'); if (pf) pf.focus(); return; }
      if (e.target.id === 'pncancel') { pnForm = null; paint(); return; }
      if (e.target.id === 'pnsave') {
        var pnm = $('#pnname').value.trim(); if (!pnm) { $('#pnerr').textContent = 'חסר שם מוצר'; return; }
        var pit = { id: 'p' + Date.now(), name: pnm, cat: $('#pncat').value, min: Math.max(0, Number($('#pnmin').value) || 0), unit: $('#pnunit').value, stock: Math.max(0, Number($('#pnstock').value) || 0), ord: Date.now() };
        if (pnImg) pit.img = pnImg;
        store.savePantry(pit).then(function () { pnForm = null; if (store.mode === 'local') loadPantry(); else { if (!PANTRY.some(function (x) { return x.id === pit.id; })) PANTRY.push(pit); paint(); } }).catch(function () { $('#pnerr').textContent = 'השמירה נכשלה'; });
        return;
      }
      var pd_ = e.target.closest('[data-pdel]'); if (pd_) { if (!confirm('למחוק את הפריט?')) return; var pid_ = pd_.dataset.pdel; store.deletePantry(pid_).then(function () { PANTRY = PANTRY.filter(function (x) { return x.id !== pid_; }); paint(); }); return; }
      var fs = e.target.closest('[data-fstep]'); if (fs) { var fi = $('#pnstock'); fi.value = Math.max(0, pnRound((Number(fi.value) || 0) + Number(fs.dataset.fstep) * pnStepOf($('#pnunit').value))); return; }
      var ps = e.target.closest('[data-pstep]'); if (ps) { var prow = ps.closest('.pr'), pin = prow.querySelector('[data-pstock]'); var pit_ = PANTRY.filter(function (x) { return x.id === prow.dataset.pid; })[0]; pin.value = Math.max(0, pnRound((Number(pin.value) || 0) + Number(ps.dataset.pstep) * pnStepOf(pit_ && pit_.unit))); pnStock(prow, pin); return; }
      if (e.target.id === 'rcnew') { rcEdit = {}; paint(); return; }
      if (e.target.id === 'rccancel') { rcEdit = null; paint(); return; }
      var re_ = e.target.closest('[data-rcedit]'); if (re_) { rcEdit = RECIPES.filter(function (x) { return x.id === re_.dataset.rcedit; })[0] || {}; paint(); return; }
      var rd_ = e.target.closest('[data-rcdel]'); if (rd_) { if (!confirm('למחוק את המתכון?')) return; store.deleteRecipe(rd_.dataset.rcdel).then(function () { if (store.mode === 'local') loadRecipes(); }); return; }
      if (e.target.id === 'rcsave') {
        var nm = $('#rcname').value.trim(), lines_ = function (v) { return v.split('\n').map(function (x) { return x.trim(); }).filter(Boolean); };
        if (!nm) { $('#rcerr').textContent = 'חסר שם למתכון'; return; }
        var old = RECIPES.filter(function (x) { return x.id === $('#rcid').value; })[0], rec = { id: $('#rcid').value || ('r' + Date.now()), name: nm, ingredients: lines_($('#rcing').value), steps: lines_($('#rcsteps').value), ord: old && old.ord ? old.ord : Date.now() };
        var nt = $('#rcnote').value.trim(); if (nt) rec.note = nt;
        var cs = $('#rccat').value; if (cs !== 'other' && (cs !== rcCat({ name: nm }) || (old && old.cat))) rec.cat = cs;
        store.saveRecipe(rec).then(function () { rcEdit = null; if (store.mode === 'local') loadRecipes(); else paint(); }).catch(function () { $('#rcerr').textContent = 'השמירה נכשלה'; });
        return;
      }
      if (e.target.id === 'psave') { var pl = Array.prototype.map.call(document.querySelectorAll('.ptext'), function (x) { return x.value.trim().slice(0, 80); }).slice(0, 5), pp = { text: pl.filter(Boolean)[0] || '', lines: pl, on: $('#pon').checked }; store.savePromo(pp).then(function () { promo = pp; $('#pmsg').textContent = 'נשמר ✓'; }).catch(function () { $('#pmsg').textContent = 'השמירה נכשלה'; }); return; }
      if (e.target.id === 'nadd') {
        var code = ($('#nc').value || '').trim().toUpperCase().replace(/[^A-Z0-9_-]/g, ''), v = Number($('#nv').value), t = $('#nt').value, er = $('#nerr');
        if (code.length < 3) { er.textContent = 'קוד קצר מדי (לפחות 3 תווים באנגלית/מספרים)'; return; }
        if (!(v > 0) || (t === 'percent' && v > 100)) { er.textContent = 'ערך לא תקין'; return; }
        store.saveCoupon({ code: code, type: t, value: v, min: Number($('#nm').value) || 0, expires: $('#ne').value || '', active: true }).then(function () { if (store.mode === 'local') { store.watchCoupons(function (c) { coupons = c; paint(); }); } });
      }
    });
    function pnStock(row, inp) {
      var it = PANTRY.filter(function (x) { return x.id === row.dataset.pid; })[0]; if (!it) return;
      it.stock = Math.max(0, pnRound(Number(inp.value) || 0)); inp.value = it.stock;
      var wb = $('#pnwa'); if (wb) wb.textContent = '📲 שלח רשימת קניות' + (PANTRY.filter(function (x) { return pnRec(x) > 0; }).length ? ' (' + PANTRY.filter(function (x) { return pnRec(x) > 0; }).length + ')' : '');
      row.querySelector('[data-prec]').textContent = 'כמות מומלצת להזמנה: ' + pnRec(it);
      store.savePantry(it);
    }
    $('#ap').addEventListener('change', function (e) {
      if (e.target.hasAttribute && e.target.hasAttribute('data-punit')) { var ur = e.target.closest('.pr'), ui = PANTRY.filter(function (x) { return x.id === ur.dataset.pid; })[0]; if (ui) { ui.unit = e.target.value; store.savePantry(ui); } return; }
      if (e.target.hasAttribute && e.target.hasAttribute('data-pstock')) { pnStock(e.target.closest('.pr'), e.target); return; }
      if (e.target.id === 'pnfile') {
        var pfl = e.target.files[0]; pnImg = ''; if (!pfl) return;
        var img = new Image(), url = URL.createObjectURL(pfl);
        img.onload = function () { var m = 96, k = Math.min(1, m / Math.max(img.width, img.height)), cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k); cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); pnImg = cv.toDataURL('image/jpeg', .75); URL.revokeObjectURL(url); };
        img.src = url; return;
      }
      if (e.target.id !== 'rcfile' || !e.target.files[0]) return;
      var fr = new FileReader();
      fr.onload = function () {
        try {
          var arr = JSON.parse(fr.result); if (!Array.isArray(arr)) throw 0;
          Promise.all(arr.map(function (r, k) { return store.saveRecipe({ id: String(r.id || 'r' + Date.now() + k).replace(/[^\w-]/g, ''), name: String(r.name || '').slice(0, 120), ingredients: (r.ingredients || []).map(String), steps: (r.steps || []).map(String), note: r.note ? String(r.note).slice(0, 300) : undefined, cat: RC_CATS.some(function (c) { return c[0] === r.cat; }) ? r.cat : undefined, ord: r.ord || (Date.now() + k) }); })).then(function () { alert('יובאו ' + arr.length + ' מתכונים'); if (store.mode === 'local') loadRecipes(); });
        } catch (x) { alert('קובץ לא תקין'); }
      };
      fr.readAsText(e.target.files[0]); e.target.value = '';
    });
    $('#ap').addEventListener('toggle', function (e) { var d = e.target; if (d && d.classList && d.classList.contains('rc') && d.open) { var sm = d.querySelector('summary'); if (sm) sm.scrollIntoView({ block: 'start', behavior: 'smooth' }); } }, true);
    function loadRecipes() { store.watchRecipes(function (r) { if (r) { RECIPES = r; if (tab === 'recipes') paint(); } }); }
    function loadPantry() { store.getPnSet().then(function (v) { if (v && Number(v.thr) > 0) { PN_THR = Number(v.thr); if (tab === 'pantry' && !pnForm) paint(); } }); store.watchPantry(function (r) { if (r) { PANTRY = r; if (tab === 'pantry' && !pnForm) paint(); } }); }
    function loadCustomers() {
      store.watchCustomers(function (c, err) {
        if (err) { custErr = true; if (tab === 'customers') paint(); return; }
        custErr = false; CUSTOMERS = c || []; custReady = true; if (tab === 'customers') paint();
        syncCustomers(orders, store, function () { if (store.mode === 'local') loadCustomers(); });
      });
    }
    loadRecipes(); loadPantry(); loadCustomers();
    if (window._rcSpy) window.removeEventListener('scroll', window._rcSpy);
    window._rcSpy = function () {
      var pan = tab === 'pantry';
      if ((tab !== 'recipes' && !pan) || Date.now() < (pan ? pnLock : rcLock)) return;
      var secs = document.querySelectorAll('section.rcat'); if (!secs.length) return;
      var cur = secs[0].id;
      Array.prototype.forEach.call(secs, function (sc) { if (sc.getBoundingClientRect().top <= 90) cur = sc.id; });
      if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) cur = secs[secs.length - 1].id;
      var id = cur.replace(/^[rp]cat-/, ''); if (pan) { if (id !== pnActive) { pnActive = id; pnMark(); } } else if (id !== rcActive) { rcActive = id; rcMark(); }
    };
    window.addEventListener('scroll', window._rcSpy, { passive: true });
    store.watchOrders(function (o, err) { if (err) { $('#ap').innerHTML = '<p>אין הרשאה לקרוא הזמנות.</p>'; return; } orders = o; paint(); checkReminders(orders); syncCustomers(orders, store, function () { if (store.mode === 'local') loadCustomers(); }); });
    if (window._remTimer) clearInterval(window._remTimer);
    window._remTimer = setInterval(function () { if (location.hash === '#admin') checkReminders(orders); }, 60000);
    store.watchCoupons(function (c) { if (c) { coupons = c; if (tab !== 'promo') paint(); } });
    store.getPromo().then(function (p) { if (p) { promo = p; if (tab === 'promo') paint(); } });
  }

  /* =====================  אתחול  ===================== */
  document.addEventListener('click', function (e) {
    var chip = e.target.closest('.chip[data-cat]'); if (chip) { var s = $('#cat-' + chip.dataset.cat); setActive(chip.dataset.cat); spyLock = Date.now() + 1000; if (s) s.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
    var item = e.target.closest('.item'); if (!item) return;
    var pimg = e.target.closest('.pic img'); if (pimg) { openLb(pimg); return; }
    var id = item.dataset.item, it = findItem(id), o = selOpt[id] == null ? 0 : selOpt[id];
    if (e.target.closest('[data-showopts]')) { openOpt[id] = true; renderMenuKeep(); return; }
    var cb = e.target.closest('[data-o]');
    if (cb && it.opts) { var oo = Number(cb.dataset.o); if (cb.hasAttribute('data-plus')) { change(id, oo, 1); flyToCart(cb); } else change(id, oo, -1); renderMenuKeep(); return; }
    var op = e.target.closest('.opt'); if (op) {
      if (op.classList.contains('optpic') && op.getAttribute('aria-pressed') === 'true') { var on = op.classList.toggle('zoomed'); zoomOpt[id] = on ? Number(op.dataset.opt) : null; return; }   // לחיצה על הגודל הנבחר: הגדלת התמונה
      selOpt[id] = Number(op.dataset.opt); zoomOpt[id] = null; renderMenuKeep();
      var nb = document.querySelector('.item[data-item="' + id + '"] .optpic[data-opt="' + selOpt[id] + '"]');   // אנימציית זום אין גם בבחירת גודל חדש
      if (nb) { requestAnimationFrame(function () { requestAnimationFrame(function () { nb.classList.add('zoomed'); zoomOpt[id] = selOpt[id]; }); }); }
      return;
    }
    if (e.target.closest('[data-plus]')) { var pb = e.target.closest('[data-plus]'); change(id, it.opts ? o : null, 1); flyToCart(pb); renderMenuKeep(); }
    else if (e.target.closest('[data-minus]')) { change(id, it.opts ? o : null, -1); renderMenuKeep(); }
  });
  $('#cartBtn').onclick = openCheckout;
  $('#fcart').onclick = openCheckout;
  window.addEventListener('scroll', spy, { passive: true });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { if (!closeLb()) closeModal(); } });
  function route() { var adm = location.hash === '#admin', st = $('#sidetab'); if (st) st.style.display = adm ? 'none' : ''; var fc = $('#fcart'); if (fc) fc.style.display = adm ? 'none' : ''; var ar = $('#a11y-root'); if (ar) ar.style.display = adm ? 'none' : ''; if (location.hash === '#admin') renderAdmin(); else { remStop(); closeModal(); renderMenu(); spy(); } }
  window.addEventListener('hashchange', route);
  var init = CONFIG.firebase ? fbStore().catch(function () { return localStore(); }) : Promise.resolve(localStore());
  mountSideTab();
  mountA11y();
  init.then(function (s) {
    store = s; route(); setTimeout(hanukahPopup, 3000); startPromo();
    if (s.mode === 'firebase' && fb && fb.auth) {
      var unsub = null;
      fb.auth.onAuthStateChanged(function (u) {
        if (unsub) { unsub(); unsub = null; }
        if (u && u.emailVerified && CONFIG.ownerEmails.indexOf((u.email || '').toLowerCase()) >= 0) {
          unsub = s.watchNew(function (n) { newCount = n; paintNewBar(); });
        } else { newCount = 0; paintNewBar(); }
      });
    }
  });
  window.__salads = { cart: function () { return cart; }, store: function () { return store; } };
})();
</script>
